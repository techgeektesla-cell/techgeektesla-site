[build]
  publish = "."

# No splat 404 redirect: it intercepts Netlify form POSTs.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/fsd_referral"
  to = "https://www.tesla.com/get-app/referral?code=scott772523"
  status = 302
  force = true

[[redirects]]
  from = "/fsd_referral/"
  to = "https://www.tesla.com/get-app/referral?code=scott772523"
  status = 302
  force = true
